name: Morning Executor

on:
  schedule:
    - cron: "46 3 * * *"  # 9:16 AM IST — right after NSE market open (9:15 AM)
  workflow_dispatch:

concurrency:
  group: repo-write-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Morning Executor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=. python scripts/morning_executor.py
      - name: Commit updated state back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- storage/trades/ storage/reports/
          git diff --staged --quiet || git commit -m "Morning execution update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git push && break
            echo "Push rejected (likely a concurrent workflow pushed first) — pulling and retrying ($i/5)..."
            git pull --rebase origin main
            sleep 5
          done
